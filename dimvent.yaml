# https://github.com/malinovsku/dimvent
substitutions:
  device_name: dimvent
  friendly_name: Dimvent
  project: "malinovsku.Dimvent"
  name_add_mac_suffix: "false"

  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_wifi_password: !secret wifi_ap_pass
  api_key: !secret api_key
  ota_password: !secret ota_password

  speed_high: 1.0
  speed_medium: 0.8
  speed_low: 0.68
  time_check_spin: 1100ms # Интервал проверки угла
  time_stoped_motor: 650ms # Время остановки мотора
  direction: clockwise

  pin_output_1: GPIO03
  pin_output_2: GPIO04
  pin_light: GPIO05
  pin_dir: GPIO10
  pin_sda: GPIO06
  pin_scl: GPIO07
  pin_button_1: GPIO00
  pin_button_2: GPIO01
  # Число попыток автоматического возврата в рабочий диапазон.
  recovery_attempts: "3"
  # Максимальное время движения за одну попытку.
  recovery_timeout: 10s
  # Пауза после торможения перед следующей попыткой.
  recovery_pause: 500ms
api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${device_name}
    password: ${ap_wifi_password}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: ${name_add_mac_suffix}
  min_version: 2025.12.0
  project:
    name: ${project}
    version: ${device_name}
  comment: ${project}
  on_boot:
    priority: -800
    then:
      - button.press: fix_problem

captive_portal:

logger:
  level: INFO

web_server:
    port: 80
    version: 3

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}

as5600:
  start_position: 0deg
  range: 360deg
  id: my_as5600
  dir_pin: ${pin_dir}
  direction: ${direction}

globals:
  - id: g_speed
    type: float
    restore_value: true
  - id: g_speed_latest
    type: float
    initial_value: '0.0'
  - id: position_new
    type: float
    initial_value: '0.0'
  - id: position_latest
    type: float
    initial_value: '0.0'
  - id: gl_check_spin_latest
    type: float
    initial_value: '0.0'
  # Положение по AS5600 без ограничения диапазоном 0...1.
  - id: position_unclamped
    type: float
    initial_value: 'NAN'

binary_sensor:
  - platform: status
    name: Status esp
    entity_category: diagnostic
  - platform: template
    name: "Attempts exceeded"
    device_class: problem
    id: problem_attempts_exceeded
    on_press:
      then:
        - light.turn_on:
            id: status_light
            brightness: 100%
            red: 100%
            green: 0%
            blue: 0%
            effect: "Fast Pulse"
    on_release:
      then:
        - light.turn_off: status_light
  - platform: gpio
    name: Button1
    disabled_by_default: true
    id: bt1
    filters:
      - delayed_on: 100ms
    pin:
      number: ${pin_button_1}
      mode: INPUT_PULLUP
      inverted: True
    on_multi_click:
      # Короткое нажатие (< 800 мс) — обычное открытие / стоп
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.3s
        then:
          - if:
              condition:
                - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_IDLE;
              then:
                - cover.open: window
              else:
                - cover.stop: window
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.4s
          - ON for at most 0.5s
          - OFF for at least 0.3s
        then:
          - logger.log: "BT1 double click -> fix_problem"
          - button.press: fix_problem
      # Длинное нажатие (>= 1.5 с) — ручное вращение против часовой (открытие)
      - timing:
          - ON for at least 1.5s
        then:
          - logger.log: "BT1 long press -> run_counterclockwise"
          - script.execute: run_counterclockwise
          - wait_until:
              condition:
                binary_sensor.is_off: bt1
          - script.execute: motor_stop

  - platform: gpio
    name: Button2
    disabled_by_default: true
    id: bt2
    filters:
      - delayed_on: 100ms
    pin:
      number: ${pin_button_2}
      mode: INPUT_PULLUP
      inverted: True
    on_multi_click:
      # Короткое нажатие — обычное закрытие / стоп
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.3s
        then:
          - if:
              condition:
                - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_IDLE;
              then:
                - cover.close: window
              else:
                - cover.stop: window
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.4s
          - ON for at most 0.5s
          - OFF for at least 0.3s
        then:
          - logger.log: "BT1 double click -> fix_problem"
          - button.press: fix_problem
      # Длинное нажатие — ручное вращение по часовой (закрытие)
      - timing:
          - ON for at least 1.5s
        then:
          - logger.log: "BT2 long press -> run_clockwise"
          - script.execute: run_clockwise
          - wait_until:
              condition:
                binary_sensor.is_off: bt2
          - script.execute: motor_stop

number:
  - platform: template
    name: "Angle Closed Position"
    icon: "mdi:window-closed"
    entity_category: CONFIG
    min_value: 0
    max_value: 360
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 100
    id: angle_pos_closed
    on_value:
      then:
        - select.set:
            id: speed
            option: "Low"
        - if:
            condition:
              - lambda: return x > id(angle).state;
            then:
              - script.execute: run_counterclockwise
              - wait_until:
                  lambda: return x <= id(angle).state;
              - script.execute: motor_stop
            else:
              - if:
                  condition:
                    - lambda: return x < id(angle).state;
                  then:
                    - script.execute: run_clockwise
                    - wait_until:
                        lambda: return x >= id(angle).state;
                    - script.execute: motor_stop
  - platform: template
    name: "Number repeat attempts"
    icon: "mdi:repeat-variant"
    entity_category: CONFIG
    min_value: 0
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 3
    id: number_repeat_attempts
    mode: box
  - platform: template
    name: "Limit Open High"
    icon: "mdi:arrow-split-vertical"
    entity_category: CONFIG
    min_value: 0.0
    max_value: 10
    step: 0.1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 5
    id: lim_open_high
  - platform: template
    name: "Limit Closed High"
    icon: "mdi:arrow-collapse-horizontal"
    entity_category: CONFIG
    min_value: 0.0
    max_value: 10
    step: 0.1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 5
    id: lim_close_high
  - platform: template
    name: "Limit Open Medium"
    icon: "mdi:arrow-split-vertical"
    entity_category: CONFIG
    min_value: 0.0
    max_value: 10
    step: 0.1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 5
    id: lim_open_medium
  - platform: template
    name: "Limit Closed Medium"
    icon: "mdi:arrow-collapse-horizontal"
    entity_category: CONFIG
    min_value: 0.0
    max_value: 10
    step: 0.1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 5
    id: lim_close_medium
  - platform: template
    name: "Limit Open Low"
    icon: "mdi:arrow-split-vertical"
    entity_category: CONFIG
    min_value: 0.0
    max_value: 10
    step: 0.1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 5
    id: lim_open_low
  - platform: template
    name: "Limit Closed Low"
    icon: "mdi:arrow-collapse-horizontal"
    entity_category: CONFIG
    min_value: 0.0
    max_value: 10
    step: 0.1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 5
    id: lim_close_low
  - platform: template
    name: "Angle Opening"
    icon: "mdi:angle-acute"
    entity_category: CONFIG
    min_value: 0
    max_value: 180
    step: 1
    optimistic: true
    mode: box
    restore_value: true
    initial_value: 180
    id: angle_opening

select:
  - platform: template
    name: "Speed"
    icon: "mdi:speedometer"
    optimistic: true
    entity_category: CONFIG
    restore_value: true
    options:
      - Low
      - Medium
      - High
    initial_option: Medium
    id: speed
    set_action:
      then:
        - if:
            condition:
              - lambda: return x == "High";
            then:
              - lambda: id(g_speed) = ${speed_high};
            else:
              - if:
                  condition:
                    - lambda: return x == "Medium";
                  then:
                    - lambda: id(g_speed) = ${speed_medium};
                  else:
                    - lambda: id(g_speed) = ${speed_low};
        - logger.log:
            level: INFO
            format: "speed set_action. g_speed=%.2f"
            args: [ 'id(g_speed)' ]
        - script.execute: speed_change_move
  - platform: template
    name: "Forced power increase"
    icon: "mdi:speedometer"
    optimistic: true
    entity_category: CONFIG
    restore_value: true
    options:
      - "OFF"
      - Step
      - Medium
      - High
    initial_option: Step
    id: select_forced_power

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    default_transition_length: 0s
    pin: ${pin_light}
    num_leds: 1
    chipset: ws2812
    name: "Light"
    id: status_light
    entity_category: CONFIG
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 500ms
          update_interval: 2s

sensor:
  - platform: wifi_signal
    name: Wifi signal esp
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime esp
    update_interval: 5min
    id: uptime_sensor
  - platform: internal_temperature
    name: Chip Temperature
  - platform: template
    name: "Unsuccessful attempts"
    icon: "mdi:alert"
    id: unsuccessful_attempts
    accuracy_decimals: 0
    on_value:
      then:
        - if:
            condition:
              - lambda: return x >= id(number_repeat_attempts).state;
            then:
              - binary_sensor.template.publish:
                  id: problem_attempts_exceeded
                  state: ON
            else:
              - binary_sensor.template.publish:
                  id: problem_attempts_exceeded
                  state: OFF
  - platform: as5600
    update_interval: 30ms
    name: Angle
    unit_of_measurement: '°'
    accuracy_decimals: 0
    icon: mdi:angle-acute
    id: angle
    filters:
      - lambda: 'return x * as5600::RAW_TO_DEGREES * id(my_as5600).get_range_scale();'
      - delta: 2
    status:
      name: Status magnet
      # Добавить логику если проблемы с магнитом
    on_value:
      then:
        - lambda: |-
            const float closed = id(angle_pos_closed).state;
            const float opening = id(angle_opening).state;

            if (!std::isfinite(x) ||
                !std::isfinite(closed) ||
                !std::isfinite(opening) ||
                opening <= 0.0f) {
              id(position_unclamped) = NAN;
              return;
            }

            // Представляем угол относительно середины рабочего диапазона.
            // Это позволяет учитывать переход AS5600 через 0/360 градусов.
            const float center = closed + opening * 0.5f;
            float offset = fmodf(x - center + 180.0f, 360.0f);
            if (offset < 0.0f) {
              offset += 360.0f;
            }
            offset -= 180.0f;

            const float continuous_angle = center + offset;
            const float position = (continuous_angle - closed) / opening;

            id(position_unclamped) = position;

            // Существующая цепочка продолжит формировать положение 0...1.
            id(position_current).publish_state(continuous_angle);

  - platform: template
    id: position_current
    filters:
      - lambda: return ((x-id(angle_pos_closed).state)/id(angle_opening).state);
      - delta: 0.01
      - clamp:
          min_value: 0.0
          max_value: 1.0
    on_value:
      then:
        - sensor.template.publish:
            id: position_current_percent
            state: !lambda 'return x;'
  - platform: template
    name: "Position"
    id: position_current_percent
    icon: mdi:select-place
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - lambda: return int(x*100);
      - clamp:
          min_value: 0
          max_value: 100
  - platform: ina226
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_current: 3.2A
    adc_averaging: 4
    adc_time:
      voltage: 140us
      current: 140us
    update_interval: 500ms
    # current:
    #   name: "Current"
    #   disabled_by_default: true
    # bus_voltage:
    #   name: "Voltage"
    #   disabled_by_default: true
    power:
      name: "Power"
      filters:
        - delta: 0.01
      id: s_power
      on_value:
        then:
        - if:
            condition:
              or:
              - and:
                - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_OPENING;
                - or:
                  - lambda: return std::string(id(speed).current_option()) == "High" and x >= id(lim_open_high).state;
                  - lambda: return std::string(id(speed).current_option()) == "Medium" and x >= id(lim_open_medium).state;
                  - lambda: return std::string(id(speed).current_option()) == "Low" and x >= id(lim_open_low).state;
              - and:
                - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_CLOSING;
                - or:
                  - lambda: return std::string(id(speed).current_option()) == "High" and x >= id(lim_close_high).state;
                  - lambda: return std::string(id(speed).current_option()) == "Medium" and x >= id(lim_close_medium).state;
                  - lambda: return std::string(id(speed).current_option()) == "Low" and x >= id(lim_close_low).state;
            then:
              - if:
                  condition:
                    or:
                    - and:
                      - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_OPENING;
                      - lambda: return id(position_new) < id(position_latest);
                    - and:
                      - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_CLOSING;
                      - lambda: return id(position_new) > id(position_latest);
                  then:
                    - logger.log:
                        level: INFO
                        format: "OVERLOAD ON RETURN! Power=%.2fW. STOP ACTION COVER"
                        args: [ 'x' ]
                    - script.execute: motor_stop
                    - script.stop: waiting_action_work
                    - script.stop: power_overdrawn
                    - sensor.template.publish:
                        id: unsuccessful_attempts
                        state: 15
                  else:
                    - logger.log:
                        level: INFO
                        format: "OVERLOAD! Power=%.2fW"
                        args: [ 'x' ]
                    - script.execute: power_overdrawn

output:
  - platform: ledc
    id: my_output_id1
    inverted: false
    max_power: 1
    min_power: 0
    pin: ${pin_output_1}
    frequency: 25000
  - platform: ledc
    id: my_output_id2
    inverted: false
    max_power: 1
    min_power: 0
    pin: ${pin_output_2}
    frequency: 25000

cover:
  - platform: template
    name: Window
    id: window
    lambda: return id(position_current).state;
    open_action:
      then:
        - script.execute:
            id: recover_and_move
            target_position: 1.0

    close_action:
      then:
        - script.execute:
            id: recover_and_move
            target_position: 0.0

    position_action:
      then:
        - script.execute:
            id: recover_and_move
            target_position: !lambda 'return pos;'

    stop_action:
      then:
        - script.stop: recover_and_move
        - script.stop: action_cover_pos
        - script.stop: power_overdrawn
        - script.stop: waiting_action_work
        - script.stop: check_spin
        - script.execute: motor_stop
        - button.press: fix_problem

script:
  - id: recover_and_move
    mode: restart
    parameters:
      target_position: float
    then:
      # Отменяем предыдущую команду и её фоновые проверки.
      - script.stop: action_cover_pos
      - script.stop: power_overdrawn
      - script.stop: waiting_action_work
      - script.stop: check_spin

      - script.execute: motor_stop
      - script.wait: motor_stop

      - button.press: fix_problem

      # Возвращаем выбранную пользователем скорость:
      # check_spin мог временно увеличить g_speed.
      - lambda: |-
          const std::string selected = id(speed).current_option();
          if (selected == "High") {
            id(g_speed) = ${speed_high};
          } else if (selected == "Medium") {
            id(g_speed) = ${speed_medium};
          } else {
            id(g_speed) = ${speed_low};
          }

      - repeat:
          count: ${recovery_attempts}
          then:
            - if:
                condition:
                  lambda: |-
                    const float p = id(position_unclamped);
                    return std::isfinite(p) && (p < 0.0f || p > 1.0f);
                then:
                  - logger.log:
                      level: WARN
                      format: "Outside working range: %.3f. Recovery attempt."
                      args: ['id(position_unclamped)']

                  # При восстановлении cover остаётся IDLE.
                  # Обычные power_overdrawn/check_spin не запускаются.
                  # Мощность проверяется отдельно в wait_until ниже.
                  - if:
                      condition:
                        lambda: 'return id(position_unclamped) < 0.0f;'
                      then:
                        - script.execute: run_counterclockwise

                        - wait_until:
                            condition:
                              lambda: |-
                                const float p = id(position_unclamped);
                                const float power = id(s_power).state;
                                const std::string selected = id(speed).current_option();

                                float limit = id(lim_open_high).state;
                                if (selected == "Medium") {
                                  limit = id(lim_open_medium).state;
                                } else if (selected == "Low") {
                                  limit = id(lim_open_low).state;
                                }

                                return !std::isfinite(p) ||
                                       !std::isfinite(power) ||
                                       p >= 0.0f ||
                                       power >= limit;
                            timeout: ${recovery_timeout}

                      else:
                        - script.execute: run_clockwise

                        - wait_until:
                            condition:
                              lambda: |-
                                const float p = id(position_unclamped);
                                const float power = id(s_power).state;
                                const std::string selected = id(speed).current_option();

                                float limit = id(lim_close_high).state;
                                if (selected == "Medium") {
                                  limit = id(lim_close_medium).state;
                                } else if (selected == "Low") {
                                  limit = id(lim_close_low).state;
                                }

                                return !std::isfinite(p) ||
                                       !std::isfinite(power) ||
                                       p <= 1.0f ||
                                       power >= limit;
                            timeout: ${recovery_timeout}

                  - script.execute: motor_stop
                  - script.wait: motor_stop
                  - delay: ${recovery_pause}

      # После торможения проверяем фактическое положение заново.
      - if:
          condition:
            lambda: |-
              const float p = id(position_unclamped);
              return std::isfinite(p) && p >= 0.0f && p <= 1.0f;
          then:
            - logger.log:
                level: INFO
                format: "Working range restored. Position=%.3f, target=%.3f"
                args:
                  - 'id(position_unclamped)'
                  - 'target_position'

            # Не запускаем мотор, если цель уже достигнута.
            # Допуск соответствует фильтру угла delta: 2 градуса.
            - if:
                condition:
                  lambda: |-
                    const float tolerance = 2.0f / id(angle_opening).state;
                    return fabsf(id(position_unclamped) - target_position) > tolerance;
                then:
                  - script.execute:
                      id: action_cover_pos
                      new_position: !lambda 'return target_position;'

          else:
            - logger.log:
                level: ERROR
                format: "Recovery failed or invalid angle. Position=%.3f"
                args: ['id(position_unclamped)']

            - script.execute: motor_stop
            - script.wait: motor_stop

            - sensor.template.publish:
                id: unsuccessful_attempts
                state: !lambda |-
                  return fmaxf(3.0f, id(number_repeat_attempts).state);

            - binary_sensor.template.publish:
                id: problem_attempts_exceeded
                state: ON
                
  - id: motor_stop
    mode: restart 
    then:
      - logger.log:
          level: INFO
          format: "|motor_stop|START|"
      - cover.template.publish:
          id: window
          current_operation: IDLE
      - script.stop: action_cover_pos
      - output.turn_on: my_output_id1
      - output.turn_on: my_output_id2
      - delay: ${time_stoped_motor}
      - output.turn_off: my_output_id1
      - output.turn_off: my_output_id2
      - logger.log:
          level: INFO
          format: "|motor_stop|FINISH|"
  - id: action_cover_pos
    mode: restart 
    parameters:
      new_position: float
    then:
        - logger.log:
            level: INFO
            format: "|action_cover_pos|START| new_position=%.2f"
            args: [ 'new_position']

        - script.stop: motor_stop
        - if:
            condition:
              lambda: return id(unsuccessful_attempts).state < 1;
            then:
              - lambda: id(position_new) = new_position;
              - lambda: id(position_latest) = id(window).position;
              - logger.log:
                  level: INFO
                  format: "|action_cover_pos|WORK| unsuccessful_attempts=%.0f. Update position_new=%.2f and position_latest=%.2f"
                  args: [ 'id(unsuccessful_attempts).state', 'id(position_new)', 'id(position_latest)' ]
              - script.execute: waiting_action_work
            else:
              - logger.log:
                  level: INFO
                  format: "|action_cover_pos|WORK| unsuccessful_attempts=%.0f. NOT update position_new=%.2f and position_latest=%.2f"
                  args: [ 'id(unsuccessful_attempts).state', 'id(position_new)', 'id(position_latest)' ]
        - script.execute: check_spin
        - if:
            condition:
              lambda: |-
                return new_position > id(position_current).state;
            then:
              - script.execute: run_counterclockwise
              - cover.template.publish:
                  id: window
                  current_operation: !lambda |-
                        return COVER_OPERATION_OPENING;
              - wait_until:
                  condition:
                    lambda: 'return id(position_current).state >= new_position;'
                  timeout: 90s
            else:
              - script.execute: run_clockwise
              - cover.template.publish:
                  id: window
                  current_operation: !lambda |-
                        return COVER_OPERATION_CLOSING;
              - wait_until:
                  condition:
                    lambda: 'return id(position_current).state <= new_position;'
                  timeout: 90s
        - logger.log:
            level: INFO
            format: "|action_cover_pos|FINISH| new_position=%.2f. window position=%.2f"
            args: ['new_position', 'id(window).position' ]
        - script.execute: motor_stop

  - id: run_counterclockwise
    mode: restart 
    then:
      - logger.log:
          level: INFO
          format: "|run_counterclockwise|START|"
      - script.stop: run_clockwise
      - script.stop: motor_stop
      - output.turn_off: my_output_id1
      - output.turn_off: my_output_id2
      - lambda: id(my_output_id1).set_level(id(g_speed));
  - id: run_clockwise
    mode: restart 
    then:
      - logger.log:
          level: INFO
          format: "|run_clockwise|START|"
      - script.stop: run_counterclockwise
      - script.stop: motor_stop
      - output.turn_off: my_output_id1
      - output.turn_off: my_output_id2
      - lambda: id(my_output_id2).set_level(id(g_speed));
  - id: waiting_action_work
    mode: restart 
    then:
      - logger.log:
          level: INFO
          format: "|waiting_action_work|START| position_new=%.2f"
          args: [ 'id(position_new)' ]
      - if:
          condition:
            lambda: 'return id(position_current).state < id(position_new);'
          then:
            - wait_until:
                condition:
                  - lambda: 'return id(position_current).state >= id(position_new);'
          else:
            - wait_until:
                condition:
                  - lambda: 'return id(position_current).state <= id(position_new);'
      - script.stop: power_overdrawn
      - button.press: fix_problem
      - logger.log:
          level: INFO
          format: "|waiting_action_work|FINISH| unsuccessful_attempts=%.0f. Window position=%.2f"
          args: ['id(unsuccessful_attempts).state', 'id(window).position' ]
  - id: power_overdrawn
    mode: restart 
    then:
      - sensor.template.publish:
          id: unsuccessful_attempts
          state: !lambda 'return id(unsuccessful_attempts).state + 1;'
      - logger.log:
          level: INFO
          format: "|power_overdrawn|START| unsuccessful_attempts=%.0f. Window position=%.2f. SEND position_latest=%.2f"
          args: [ 'id(unsuccessful_attempts).state', 'id(window).position', 'id(position_latest)' ]
      - script.execute: motor_stop
      - script.wait: motor_stop
      - lambda: id(action_cover_pos)->execute(id(position_latest));
      - if:
          condition:
            lambda: 'return id(position_current).state < id(position_latest);'
          then:
            - logger.log:
                level: INFO
                format: "|power_overdrawn|WORK| wait_until IF. Window position=%.2f. position_current=%.2f. position_latest=%.2f"
                args: [ 'id(window).position', 'id(position_current).state', 'id(position_latest)' ]
            - wait_until:
                condition:
                  - lambda: 'return id(position_current).state >= id(position_latest);'
          else:
            - logger.log:
                level: INFO
                format: "|power_overdrawn|WORK| wait_until ELSE. Window position=%.2f. position_current=%.2f. position_latest=%.2f"
                args: [ 'id(window).position', 'id(position_current).state', 'id(position_latest)' ]
            - wait_until:
                condition:
                  - lambda: 'return id(position_current).state <= id(position_latest);'
      - logger.log:
          level: INFO
          format: "|power_overdrawn|WORK| Completed the waiting. position_latest=%.2f"
          args: [ 'id(position_latest)']
      - if:
          condition:
            binary_sensor.is_off: problem_attempts_exceeded
          then:
            - logger.log:
                level: INFO
                format: "|power_overdraw|WORK| Resending position_new=%.2f"
                args: ['id(position_new)' ]
            - script.execute: motor_stop
            - script.wait: motor_stop
            - lambda: id(action_cover_pos)->execute(id(position_new));
          else:
            - logger.log:
                level: INFO
                format: "|power_overdrawn|WORK| Limit of attempts! unsuccessful_attempts=%.0f"
                args: ['id(unsuccessful_attempts).state']
  - id: check_spin
    mode: queued
    max_runs: 2
    then:
      - lambda: id(gl_check_spin_latest) = id(window).position;
      - logger.log:
          level: INFO
          format: "|check_spin|START| gl_check_spin_latest=%.2f. Speed=%.2f. select_forced_power=%s"
          args: [ 'id(gl_check_spin_latest)', 'id(g_speed)', 'id(select_forced_power).current_option().c_str()' ]
      - lambda: id(g_speed_latest) = id(g_speed);
      - delay: ${time_check_spin}
      - while:
          condition:
            - lambda: return id(window).current_operation != CoverOperation::COVER_OPERATION_IDLE;
          then:
            - if:
                condition:
                  lambda: return id(gl_check_spin_latest) == id(window).position;
                then:
                  - if:
                      condition:
                        or:
                        - lambda: return int(id(g_speed)*100) == ${speed_low*100|int} and std::string(id(select_forced_power).current_option()) == "Step";
                        - lambda: return int(id(g_speed)*100) == ${speed_low*100|int} and std::string(id(select_forced_power).current_option()) == "Medium";
                      then:
                        - lambda: id(g_speed) = ${speed_medium};
                        - script.execute: speed_change_move
                        - logger.log:
                            level: INFO
                            format: "|check_spin|SPEED UPDATE medium| New Speed=%.2f. Latest Speed=%.2f. Power=%.2fW. gl_check_spin_latest=%.2f. window position=%.2f "
                            args: [ 'id(g_speed)','id(g_speed_latest)','id(s_power).state','id(gl_check_spin_latest)','id(window).position' ]
                      else:
                        - if:
                            condition:
                              and:
                              - lambda: return std::string(id(select_forced_power).current_option()) != "Medium";
                              - or:
                                - lambda: return int(id(g_speed)*100) == ${speed_medium*100|int} and std::string(id(select_forced_power).current_option()) == "Step";
                                - lambda: return int(id(g_speed)*100) == ${speed_medium*100|int} and std::string(id(select_forced_power).current_option()) == "High";
                                - lambda: return int(id(g_speed)*100) == ${speed_low*100|int} and std::string(id(select_forced_power).current_option()) == "High";
                            then:
                              - lambda: id(g_speed) = ${speed_high};
                              - script.execute: speed_change_move
                              - logger.log:
                                  level: INFO
                                  format: "|check_spin|SPEED UPDATE high| New Speed=%.2f. Latest Speed=%.2f. Power=%.2fW. gl_check_spin_latest=%.2f. window position=%.2f "
                                  args: [ 'id(g_speed)','id(g_speed_latest)','id(s_power).state','id(gl_check_spin_latest)','id(window).position' ]
                            else:
                              - lambda: id(g_speed) = id(g_speed_latest);
                              # - script.execute: speed_change_move
                              - logger.log:
                                  level: INFO
                                  format: "|check_spin|RUN power_overdrawn| Speed=%.2f. Power=%.2fW. gl_check_spin_latest=%.2f. window position=%.2f "
                                  args: [ 'id(g_speed)','id(s_power).state','id(gl_check_spin_latest)','id(window).position' ]
                              - script.execute: power_overdrawn
                              - script.stop: check_spin
                else:
                  - logger.log:
                      level: INFO
                      format: "|check_spin|OK| Speed=%.2f. gl_check_spin_latest=%.2f. window position=%.2f"
                      args: [ 'id(g_speed)','id(gl_check_spin_latest)','id(window).position' ]
                  - lambda: id(gl_check_spin_latest) = id(window).position;
            - delay: ${time_check_spin}
      - lambda: id(g_speed) = id(g_speed_latest);
      - logger.log:
          level: INFO
          format: "|check_spin|FINISH| Speed=%.2f"
          args: [ 'id(g_speed)' ]
  - id: speed_change_move
    mode: restart 
    then:
      - if:
          condition:
            - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_OPENING;
          then:
            - output.set_level:
                id: my_output_id1
                level: !lambda 'return id(g_speed);' 
      - if:
          condition:
            - lambda: return id(window).current_operation == CoverOperation::COVER_OPERATION_CLOSING;
          then:
            - output.set_level:
                id: my_output_id2
                level: !lambda 'return id(g_speed);' 

button:
  - platform: restart
    name: Restart esp
    entity_category: diagnostic
    id: bt_restart
  - platform: template
    name: "Motor counterclockwise"
    entity_category: CONFIG
    icon: "mdi:restore"
    id: button_run_clockwise
    on_press:
      - script.execute: run_clockwise
  - platform: template
    name: "Motor clockwise"
    entity_category: CONFIG
    icon: "mdi:reload"
    id: button_run_counterclockwise
    on_press:
      - script.execute: run_counterclockwise
  - platform: template
    name: "Motor Stop"
    entity_category: CONFIG
    id: buttont_motor_stop
    icon: "mdi:stop"
    on_press:
      - script.stop: recover_and_move
      - script.stop: action_cover_pos
      - script.stop: power_overdrawn
      - script.stop: waiting_action_work
      - script.stop: check_spin
      - script.execute: motor_stop
  - platform: template
    name: "Fix problem"
    id: fix_problem
    entity_category: CONFIG
    icon: "mdi:auto-fix"
    on_press:
      - sensor.template.publish:
          id: unsuccessful_attempts
          state: 0
      - logger.log:
          level: INFO
          format: "|fix_problem|OK|"